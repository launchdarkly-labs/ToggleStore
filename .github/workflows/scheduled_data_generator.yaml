name: Scheduled Data Generator
run-name: Generating AI monitoring & agent graph data for all environments

on:
  schedule:
    # Run once daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      specific_namespace:
        description: 'Optional: run for a single namespace only (e.g. events5). Leave empty for all.'
        required: false
        default: ''

env:
  LD_API_KEY: ${{ secrets.LD_EAP_API_KEY != '' && secrets.LD_EAP_API_KEY || secrets.LD_API_KEY }}

jobs:
  generate_data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./.github/workflows/requirements.txt

      - name: Run data generator for all environments
        run: python ./.github/workflows/scheduled_data_runner.py
        env:
          LD_API_KEY: ${{ env.LD_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPECIFIC_NAMESPACE: ${{ github.event.inputs.specific_namespace }}
          OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.observability.app.launchdarkly.com:443
